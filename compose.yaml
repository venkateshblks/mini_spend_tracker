# Optional local PostgreSQL for development and tests. Not used by Render.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: spend
      POSTGRES_PASSWORD: spend_local_only
      POSTGRES_DB: spend_tracker_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend -d spend_tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
