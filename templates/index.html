<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Spend Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">A little clarity, every month</p><h1>Mini Spend Tracker</h1>
      <p>Log an expense and see where your money goes. Use one currency for all entries.</p></header>
    <div class="layout">
      <section><h2>Add an expense</h2>
        <form id="expense-form">
          <label>Amount<input name="amount" type="number" min="0.01" max="999999999.99" step="0.01" placeholder="0.00" required></label>
          <label>Category<input name="category" maxlength="50" list="categories" placeholder="e.g. food" required></label>
          <datalist id="categories"><option value="food"><option value="transport"><option value="shopping"><option value="bills"><option value="other"></datalist>
          <label>Date<input name="date" id="expense-date" type="date" required></label>
          <label>Note <span>(optional)</span><textarea name="note" maxlength="500" rows="3" placeholder="What was it for?"></textarea></label>
          <button id="save-button" type="submit">Save expense</button>
        </form>
        <p id="save-status" role="status" aria-live="polite"></p>
      </section>
      <section><div class="summary-heading"><h2>Monthly summary</h2><label>Month<input id="month" type="month" required></label></div>
        <p id="summary-status" role="status" aria-live="polite"></p>
        <div id="summary-content" hidden>
          <p class="eyebrow">Total spend</p><p id="total" class="total"></p>
          <p id="comparison"></p>
          <h3>By category</h3><ul id="categories-summary"></ul>
          <div id="insights"></div>
          <h3>Expenses this month</h3><p id="empty" hidden>No expenses yet. Add your first one.</p>
          <div class="table-wrap"><table id="expense-table"><thead><tr><th>Date</th><th>Category / note</th><th>Amount</th></tr></thead><tbody id="expense-rows"></tbody></table></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
