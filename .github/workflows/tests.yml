name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spend
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: spend_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spend -d spend_tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://spend:ci_only@localhost:5432/spend_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
